# Start from your ColonDB checkpoint with precisely its original splits.
base_config: cvc_colondb_v2.yaml
experiment:
  name: rocu_cvc_colondb_finetune_seed42
training:
  init_checkpoint: runs/rocu_cvc_colondb_seed42/best.pt
  epochs: 60
  learning_rate: 1.0e-4
  backbone_lr_multiplier: 0.1
  warmup_epochs: 3
  early_stopping_patience: 15
  # Preserve the learned encoder's running statistics during small-data tuning.
  freeze_encoder_bn: true

