# Candidate training recipe; evaluate on the original validation split first.
base_config: cvc_colondb.yaml
experiment:
  name: rocu_cvc_colondb_v2_seed42
data:
  split_source: runs/rocu_cvc_colondb_seed42/splits
augmentation:
  random_crop_probability: 0.5
  crop_scale: [0.5, 1.0]
  crop_min_foreground_retained: 0.75
loss:
  # Supplement the original loss with a moderate missed-foreground penalty.
  tversky_weight: 0.3
  tversky_beta: 0.7
training:
  test_after_training: false

