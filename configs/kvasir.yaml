experiment:
  name: ocu_net_kvasir_seed42
  output_dir: runs
  seed: 42
  deterministic: false

data:
  root: dataset/Kvasir
  image_dir: images
  mask_dir: masks
  image_size: [352, 352]
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  num_workers: 4
  pin_memory: true
  persistent_workers: true

model:
  architecture: ocu_net
  in_channels: 3
  encoder_channels: [16, 32, 64, 128, 256]
  guide_channels: 8
  ocu_solver_iterations: 24
  ocu_epsilon: 1.0e-6

training:
  epochs: 150
  batch_size: 8
  eval_batch_size: 8
  optimizer: adamw
  learning_rate: 3.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  min_learning_rate: 1.0e-6
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 30
  threshold: 0.50
  test_after_training: true
  save_test_predictions: true

loss:
  bce_weight: 1.0
  dice_weight: 1.0
  p176_weight: 0.50
  p88_weight: 0.25

augmentation:
  horizontal_flip_probability: 0.50
  vertical_flip_probability: 0.20
  rotate_90_probability: 0.50
  small_rotation_probability: 0.30
  max_rotation_degrees: 15
  color_jitter_probability: 0.50
  brightness: 0.15
  contrast: 0.15
  saturation: 0.10

profiling:
  batch_size: 1
  warmup_iterations: 30
  benchmark_iterations: 100
