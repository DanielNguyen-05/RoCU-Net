experiment:
  name: rocu_kvasir_seed42
  output_dir: runs
  seed: 42
  deterministic: false

data:
  root: dataset/Kvasir-SEG
  image_dir: images
  mask_dir: masks

  # image_size: [256, 256]
  image_size: [320, 320]

  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  num_workers: 4
  pin_memory: true
  persistent_workers: true

model:
  architecture: rocu_net
  in_channels: 3
  backbone: mobilenet_v3_large
  pretrained: true
  backbone_channels: [16, 24, 40, 80]
  backbone_depths: [1, 2, 2, 2]

  # decoder_channels: [64, 48]
  # carrier_channels: 24
  # shallow_guide_channels: 16
  decoder_channels: [80, 56]
  carrier_channels: 32
  shallow_guide_channels: 24

  solver_iterations: 24
  epsilon: 1.0e-6
  routing_enabled: true
  hard_routing_inference: true

  # routing_uncertainty_threshold: 0.20
  routing_uncertainty_threshold: 0.10
  
  use_semantic_carrier: true

training:
  epochs: 250
  batch_size: 8
  eval_batch_size: 8
  optimizer: adamw
  learning_rate: 5.0e-4
  backbone_lr_multiplier: 0.20
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 5
  warmup_start_factor: 0.10
  min_learning_rate: 1.0e-6
  amp: true
  grad_clip_norm: 1.0
  early_stopping_patience: 45
  threshold: 0.50
  test_after_training: true
  save_test_predictions: true

loss:
  bce_weight: 0.50
  dice_weight: 1.00
  p176_weight: 0.40
  p88_weight: 0.20
  structure_weight: 0.50
  boundary_weight: 0.25
  routing_weight: 0.05
  boundary_kernel_size: 5

augmentation:
  horizontal_flip_probability: 0.50
  vertical_flip_probability: 0.20
  rotate_90_probability: 0.50
  small_rotation_probability: 0.30
  max_rotation_degrees: 15
  color_jitter_probability: 0.60
  brightness: 0.20
  contrast: 0.20
  saturation: 0.15

profiling:
  batch_size: 1
  warmup_iterations: 30
  benchmark_iterations: 100
